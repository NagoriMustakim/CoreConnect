<div nz-flex nzAlign="center" nzJustify="space-between" class="mb-3">
  <h1 class="m-0">Certifications</h1>
  <button nz-button nzType="primary" nzShape="round" (click)="showCertificateModal()">
    <span nz-icon nzType="plus"></span>
    Add
  </button>
</div>

<nz-table nzShowPagination nzShowSizeChanger nzFrontPagination='false' [nzData]="certifications" [nzPageSize]="pageSize"
  [nzTotal]="total" [nzPageIndex]="1" [nzShowTotal]="rangeTemplate" (nzPageIndexChange)="getCertifications($event)"
  (nzPageSizeChange)="getCertifications(1, $event)">
  <thead>
    <tr>
      <th>Title</th>
      <th>Description</th>
      <th>Action</th>
    </tr>
  </thead>
  <tbody>
    <tr *ngFor="let certification of certifications">
      <td>{{ certification.certificationTitle }}</td>
      <td>
        <p nz-typography nzEllipsis nzExpandable [nzEllipsisRows]="2" class="m-0">
          {{ certification.certificationDescription }}
        </p>
      </td>
      <td>
        <nz-space>
          <button *nzSpaceItem nz-button nzType="default" nzShape="circle"
            (click)="showCertificateModal(certification)">
            <span nz-icon nzType="edit" nzTheme="outline"></span>
          </button>
          <button *nzSpaceItem nz-button nzType="default" nzShape="circle" nzDanger
            (click)="showCertificationDeleteConfirm(certification.certificationGuid)">
            <span nz-icon nzType="delete" nzTheme="outline"></span>
          </button>
        </nz-space>
      </td>
    </tr>
  </tbody>
</nz-table>

<ng-template #rangeTemplate let-range="range" let-total>
  Showing {{ range[0] }}-{{ range[1] }} of {{ total }} records
</ng-template>

<nz-modal [(nzVisible)]="isCertificationModalVisible" nzCentered nzTitle="{{ saveMsg }} Certification"
  nzClosable="false" [nzFooter]="null" [nzBodyStyle]="{ borderRadius: '20px' }">
  <ng-container *nzModalContent>
    <form nz-form [nzAutoTips]="autoTips" [formGroup]="formCertificate" nzLayout="vertical">
      <nz-form-item>
        <nz-form-label nzRequired nzFor="certificationTitle">Name</nz-form-label>
        <nz-form-control>
          <input nz-input type="text" formControlName="certificationTitle" id="certificationTitle"
            placeholder="Enter title" />
        </nz-form-control>
      </nz-form-item>
      <nz-form-item>
        <nz-form-label nzFor="certificationDescription">Description</nz-form-label>
        <nz-form-control>
          <textarea nz-input formControlName="certificationDescription" placeholder="Enter description"
            id="certificationDescription" [nzAutosize]="{ minRows: 1, maxRows: 6 }"></textarea>
        </nz-form-control>
      </nz-form-item>
      <div nz-flex nzJustify="flex-end" [nzGap]="8">
        <button nz-button nzType="default" nzShape="round" (click)="handleCertificateModalCancel($event)">
          Cancel
        </button>
        <button nz-button nzType="primary" nzShape="round" (click)="handleCertificateModalOk()">
          Save
        </button>
      </div>
    </form>
  </ng-container>
</nz-modal>

<ng-template #elseBlock>
  <nz-empty></nz-empty>
</ng-template>
