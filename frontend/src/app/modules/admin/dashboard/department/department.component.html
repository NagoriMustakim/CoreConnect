<div class="mb-3" nz-flex [nzJustify]="'space-between'" [nzAlign]="'center'">
  <h2>Departments</h2>
  <button nz-button nzType="primary" nzShape="round" (click)="showDepartmentModal()">
    <span nz-icon nzType="plus"></span>Add
  </button>
</div>

<nz-table nzShowPagination nzShowSizeChanger nzFrontPagination="false" [nzData]="departments" [nzPageSize]="pageSize" [nzScroll]="{'y':'55vh'}"
  [nzTotal]="total" [nzPageIndex]="1" [nzShowTotal]="rangeTemplate" (nzQueryParams)="onQueryParamsChange($event)">
  <thead>
    <tr>
      <th>Department</th>
      <th>Description</th>
      <th>Actions</th>
    </tr>
  </thead>
  <tbody>
    <tr *ngFor="let department of departments">
      <td>{{ department.department}}</td>
      <td><p nz-typography nzEllipsis nzExpandable [nzEllipsisRows]="3" class="text-secondary">{{ department.departmentDescription }}</p></td>
      <td>
        <button nz-button nzType="default" nzShape="circle" (click)="showDepartmentModal(department)">
          <span nz-icon nzType="edit" nzTheme="outline"></span>
        </button>
        <nz-divider nzType="vertical"></nz-divider>
        <button nz-button nzType="default" nzShape="circle" nzDanger
            (click)="showDepartmentDeleteConfirm(department.departmentGuid)">
            <span nz-icon nzType="delete" nzTheme="outline"></span>
        </button>
      </td>
    </tr>
  </tbody>
</nz-table>

<ng-template #rangeTemplate let-range="range" let-total>
  Showing {{ range[0] }}-{{ range[1] }} of {{ total }} records
</ng-template>


<nz-modal [(nzVisible)]="isDepartmentModalVisible" nzCentered nzTitle="{{ modalTitle }} Category"
  nzClosable="false" [nzFooter]="null" [nzBodyStyle]="{ borderRadius: '20px' }">
  <ng-container *nzModalContent>
    <form nz-form [nzAutoTips]="autoTips" [formGroup]="formdepartment" nzLayout="vertical">
      <nz-form-item>
        <nz-form-label nzFor="department">Department Name</nz-form-label>
        <nz-form-control>
          <input nz-input type="text" formControlName="department" id="department" placeholder="Enter department name" />
        </nz-form-control>
      </nz-form-item>
      <nz-form-item>
        <nz-form-label nzFor="departmentDescription">Description</nz-form-label>
        <nz-form-control>
          <textarea nz-input type="text" formControlName="departmentDescription"
            id="departmentDescription" placeholder="Enter category description" [nzAutosize]="{ minRows: 1, maxRows: 6 }">
          </textarea>
        </nz-form-control>
      </nz-form-item>
      <div nz-flex nzJustify="flex-end" [nzGap]="8">
        <button nz-button nzType="default" nzShape="round" (click)="handleDepartmentModalCancel($event)">
          Cancel
        </button>
        <button nz-button nzType="primary" nzShape="round" (click)="handleDepartmentModalOk()">
          Save
        </button>
      </div>
    </form>
  </ng-container>
</nz-modal>

<ng-template #elseBlock>
  <nz-empty></nz-empty>
</ng-template>
