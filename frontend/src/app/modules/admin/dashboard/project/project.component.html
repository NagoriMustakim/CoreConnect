<div nz-flex nzAlign="center" nzJustify="space-between" class="mb-3">
  <h1 class="m-0">Projects</h1>
  <button
    nz-button
    nzType="primary"
    nzShape="round"
    (click)="showProjectModal()"
  >
    <span nz-icon nzType="plus"></span>
    Add
  </button>
</div>

<nz-table
  nzShowPagination
  nzShowSizeChanger
  nzFrontPagination="false"
  [nzData]="projects"
  [nzPageSize]="pageSize"
  [nzTotal]="total"
  [nzPageIndex]="1"
  [nzShowTotal]="rangeTemplate"
  [nzScroll]="{'y':'55vh'}"
  (nzPageIndexChange)="getProjects($event)"
  (nzPageSizeChange)="getProjects(1, $event)"
>
<thead>
  <tr>
    <th>Title</th>
    <th>Description</th>
    <th>Action</th>
  </tr>
</thead>
<tbody>
  <tr *ngFor="let project of projects">
    <td>{{ project.projectTitle }}</td>
    <td>
      <p nz-typography nzEllipsis nzExpandable [nzEllipsisRows]="2" class="m-0">
        {{ project.projectDescription }}
      </p>
    </td>
    <td>
      <nz-space>
        <button *nzSpaceItem nz-button nzType="default" nzShape="circle"
          (click)="showProjectModal(project)">
          <span nz-icon nzType="edit" nzTheme="outline"></span>
        </button>
        <button *nzSpaceItem nz-button nzType="default" nzShape="circle" nzDanger
          (click)="showProjectDeleteConfirm(project.projectGuid)">
          <span nz-icon nzType="delete" nzTheme="outline"></span>
        </button>
      </nz-space>
    </td>
  </tr>
</tbody>
</nz-table>
<ng-template #rangeTemplate let-range="range" let-total>
  Showing {{ range[0] }}-{{ range[1] }} of {{ total }} records
</ng-template>


<nz-modal [(nzVisible)]="isProjectModal" nzCentered nzTitle="{{ saveMsg }} Project"
  nzClosable="false" [nzFooter]="null" [nzBodyStyle]="{ borderRadius: '20px' }">
  <ng-container *nzModalContent>
    <form nz-form [nzAutoTips]="autoTips" [formGroup]="formProject" nzLayout="vertical">
      <nz-form-item>
        <nz-form-label nzRequired nzFor="projectTitle">Title</nz-form-label>
        <nz-form-control>
          <input nz-input type="text" formControlName="projectTitle" id="projectTitle"
            placeholder="Enter title" />
        </nz-form-control>
      </nz-form-item>
      <nz-form-item>
        <nz-form-label nzFor="projectDescription">Description</nz-form-label>
        <nz-form-control>
          <textarea nz-input formControlName="projectDescription" placeholder="Enter description"
            id="projectDescription" [nzAutosize]="{ minRows: 1, maxRows: 6 }"></textarea>
        </nz-form-control>
      </nz-form-item>
      <div nz-flex nzJustify="flex-end" [nzGap]="8">
        <button nz-button nzType="default" nzShape="round" (click)="handleProjectModalCancel($event)">
          Cancel
        </button>
        <button nz-button nzType="primary" nzShape="round" (click)="handleProjectModalOk()">
          Save
        </button>
      </div>
    </form>
  </ng-container>
</nz-modal>


<ng-template #elseBlock>
  <nz-empty></nz-empty>
</ng-template>
