<div nz-row>
  <div nz-col [nzXs]="{ span: 22, offset: 1 }" [nzLg]="{ span: 20, offset: 2 }" [nzMd]="{ span: 12, offset: 6 }"
    [nzLg]="{ span: 12, offset: 6 }" [nzXl]="{ span: 12, offset: 6 }" [nzXXl]="{ span: 12, offset: 6 }">
    <nz-card [nzBordered]="true" class="bg-light">
      <div class="mb-3" nz-flex nzJustify="flex-end">
        <button nz-button nzType="primary" nzShape="round" (click)="showFilterModal()">
          <span nz-icon nzType="filter" nzTheme="outline"></span>
          Filters
        </button>
      </div>
      <div class="result">
        <nz-list class="demo-loadmore-list" *ngIf="list!.length > 0|| initLoading; else noContent">
          @if (initLoading) {
          <nz-skeleton [nzAvatar]="true" [nzActive]="true" [nzTitle]="false" [nzLoading]="true" />
          } @else {
          @for (user of list; track user) {
          <nz-list-item>
            <nz-list-item-meta>
              <nz-list-item-meta-avatar *ngIf="user.profilePhotoName==null"
                nzSrc="../../../../../assets/images/avatar.jpg"></nz-list-item-meta-avatar>
              <nz-list-item-meta-avatar *ngIf="user.profilePhotoName!=null"
                nzSrc="{{imageUrl}}/{{user.profilePhotoName}}"></nz-list-item-meta-avatar>
              <nz-list-item-meta-title>
                <a class="mb-0" routerLink="../profile/{{user.userId}}">
                  <h4 class="m-0">{{user.employeeName}}</h4>
                </a>
                <p class="m-0 fs-small">{{ user.designation }}</p>
              </nz-list-item-meta-title>
            </nz-list-item-meta>
          </nz-list-item>
          }
          <div class="loadmore mt-3" nz-list-load-more nz-flex nzJustify="center">
            @if (loadingMore && !initLoading) {
            <button nz-button (click)="onLoadMore()">Load more</button>
            }
          </div>
          }
        </nz-list>
        <ng-template #noContent>
          <nz-result nzTitle="No result found!" nzSubTitle="Please try again with another name"></nz-result>
        </ng-template>
      </div>
    </nz-card>
  </div>

  <nz-modal [(nzVisible)]="isFilterModalVisible" nzCentered nzTitle="Filters" nzClosable="false" [nzFooter]="null"
    [nzBodyStyle]="{ borderRadius: '20px' }">
    <ng-container *nzModalContent>
      <form nz-form [nzAutoTips]="autoTips" [formGroup]="validateForm" nzLayout="vertical">
        <nz-form-item>
          <nz-form-label nzFor="designation">Designation</nz-form-label>
          <nz-form-control>
            <input nz-input type="text" formControlName="designation" id="designation"
              placeholder="e.g. Associate Software Engineer" />
          </nz-form-control>
        </nz-form-item>

        <nz-form-item>
          <nz-form-label nzFor="experience">Experience (In years)</nz-form-label>
          <nz-form-control>
            <input nz-input type="text" formControlName="experience" id="experience" placeholder="e.g. 10" onlyNumber />
          </nz-form-control>
        </nz-form-item>

        <nz-form-item>
          <nz-form-label nzFor="skills">Skills</nz-form-label>
          <nz-form-control>
            <input nz-input type="text" formControlName="skills" id="skills" placeholder="e.g. C#" />
          </nz-form-control>
        </nz-form-item>

        <nz-form-item>
          <nz-form-label nzFor="projects">Projects</nz-form-label>
          <nz-form-control>
            <input nz-input type="text" formControlName="projects" id="projects" placeholder="e.g. Linkway" />
          </nz-form-control>
        </nz-form-item>

        <nz-form-item>
          <nz-form-label nzFor="certificates">Certificates</nz-form-label>
          <nz-form-control>
            <input nz-input type="text" formControlName="certificates" id="certificates" placeholder="e.g. MS Azure" />
          </nz-form-control>
        </nz-form-item>

        <nz-form-item>
          <nz-form-label nzFor="training">Training</nz-form-label>
          <nz-form-control>
            <input nz-input type="text" formControlName="training" id="training" placeholder="e.g. Basic of Angular" />
          </nz-form-control>
        </nz-form-item>

        <div nz-flex nzJustify="flex-end" [nzGap]="8">
          <button nz-button nzType="default" nzShape="round" (click)="handleFiltersModalCancel($event)">
            Cancel
          </button>
          <button nz-button nzType="primary" nzShape="round" (click)="submitForm()">
            Apply filters
          </button>
        </div>
      </form>
    </ng-container>
  </nz-modal>
</div>
