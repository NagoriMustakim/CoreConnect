<div nz-flex nzAlign="center" nzJustify="space-between" class="mb-3">
  <h1 class="m-0">Company</h1>
  <button
    nz-button
    nzType="primary"
    nzShape="round"
    (click)="showComponyModal()"
  >
    <span nz-icon nzType="plus"></span>
    Add
  </button>
</div>

<nz-table
  nzShowPagination
  nzShowSizeChanger
  nzFrontPagination="false"
  [nzData]="companies"
  [nzPageSize]="pageSize"
  [nzTotal]="total"
  [nzPageIndex]="1"
  [nzShowTotal]="rangeTemplate"
  [nzScroll]="{'y':'55vh'}"
  (nzPageIndexChange)="getComponies($event)"
  (nzPageSizeChange)="getComponies(1, $event)"
>
<thead>
  <tr>
    <th>Company Name</th>
    <th>Description</th>
    <th>Action</th>
  </tr>
</thead>
<tbody>
  <tr *ngFor="let company of companies">
    <td>{{ company.companyName }}</td>
    <td>
      <p nz-typography nzEllipsis nzExpandable [nzEllipsisRows]="2" class="m-0">
        {{ company.companyDescription }}
      </p>
    </td>
    <td>
      <nz-space>
        <button *nzSpaceItem nz-button nzType="default" nzShape="circle"
          (click)="showComponyModal(company)">
          <span nz-icon nzType="edit" nzTheme="outline"></span>
        </button>
        <button *nzSpaceItem nz-button nzType="default" nzShape="circle" nzDanger
          (click)="showComponyDeleteConfirm(company.companyGuid)">
          <span nz-icon nzType="delete" nzTheme="outline"></span>
        </button>
      </nz-space>
    </td>
  </tr>
</tbody>
</nz-table>

<ng-template #rangeTemplate let-range="range" let-total>
  Showing {{ range[0] }}-{{ range[1] }} of {{ total }} records
</ng-template>

<nz-modal [(nzVisible)]="isComponyModalVisible" nzCentered nzTitle="{{ saveMsg }} Company"
  nzClosable="false" [nzFooter]="null" [nzBodyStyle]="{ borderRadius: '20px' }">
  <ng-container *nzModalContent>
    <form nz-form [nzAutoTips]="autoTips" [formGroup]="formCompony" nzLayout="vertical">
      <nz-form-item>
        <nz-form-label nzRequired nzFor="companyName">Title</nz-form-label>
        <nz-form-control>
          <input nz-input type="text" formControlName="companyName" id="companyName"
            placeholder="Enter title" />
        </nz-form-control>
      </nz-form-item>
      <nz-form-item>
        <nz-form-label nzFor="companyDescription">Description</nz-form-label>
        <nz-form-control>
          <textarea nz-input formControlName="companyDescription" placeholder="Enter description"
            id="companyDescription" [nzAutosize]="{ minRows: 1, maxRows: 6 }"></textarea>
        </nz-form-control>
      </nz-form-item>
      <div nz-flex nzJustify="flex-end" [nzGap]="8">
        <button nz-button nzType="default" nzShape="round" (click)="handleCompanyModalCancel($event)">
          Cancel
        </button>
        <button nz-button nzType="primary" nzShape="round" (click)="handleCompanyModalOk()">
          Save
        </button>
      </div>
    </form>
  </ng-container>
</nz-modal>

<ng-template #elseBlock>
  <nz-empty></nz-empty>
</ng-template>
