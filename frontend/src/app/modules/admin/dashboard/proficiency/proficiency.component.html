<div nz-flex [nzJustify]="'space-between'" [nzAlign]="'center'">
  <h3>Proficiencies</h3>

  <button nz-button nzType="primary" nzShape="circle" (click)="showModal()">
    <span nz-icon nzType="plus"></span>
  </button>
</div>

<nz-modal [(nzVisible)]="isModelVisible" [nzTitle]="modalTitle" [nzContent]="modalContent" [nzFooter]="null"
  (nzOnCancel)="handleCancel()">
  <ng-template #modalTitle>Create New Proficiency</ng-template>

  <ng-template #modalContent>
    <form nz-form [nzAutoTips]="autoTips" [formGroup]="service.createProficiencyModel" nzLayout="vertical" (ngSubmit)="onSubmit()">
      <nz-form-item>
        <nz-form-label nzRequired nzFor="proficiencyTitle">Proficiency</nz-form-label>
        <nz-form-control nzErrorTip="This field is required!">
          <input nz-input formControlName="proficiencyTitle" placeholder="e.g, expert" />
        </nz-form-control>
      </nz-form-item>

      <nz-form-item>
        <nz-form-label nzFor="proficiencyDescription">Description</nz-form-label>
        <nz-form-control>
          <textarea nz-input formControlName="proficiencyDescription" placeholder="Description" [nzAutosize]="{ minRows: 1, maxRows: 6 }"></textarea>
        </nz-form-control>
      </nz-form-item>

      <nz-form-item>
        <div style="width: 100%; gap: 0.3em" nz-flex [nzJustify]="'flex-end'" [nzAlign]="'center'">
          <button nz-button nzType="default" (click)="handleCancel()" nzShape="round" type="button">
            Cancel
          </button>
          <button nz-button [nzType]="'primary'" nzShape="round" [nzLoading]="service.editProficiencyModel.pending"
            type="submit">
            Create
          </button>
        </div>
      </nz-form-item>
    </form>
  </ng-template>
  <ng-template #modalFooter> </ng-template>
</nz-modal>

<nz-list>
  <div *ngIf="proficiencies.length > 0; else noContent">
    <nz-list-item *ngFor="let item of proficiencies">
      <ng-container >
        <nz-list-item-meta>
          <nz-list-item-meta-title>
            <p>{{ item.proficiencyTitle }}</p>
          </nz-list-item-meta-title>

          <nz-list-item-meta-description>
            <p>{{ item.proficiencyDescription }}</p>
          </nz-list-item-meta-description>
        </nz-list-item-meta>
        <ul nz-list-item-actions>
          <nz-list-item-action><a (click)="edit(item)"><button nz-button nzType="default" nzShape="circle">
                <span nz-icon nzType="edit" nzTheme="outline"></span></button></a></nz-list-item-action>
          <nz-list-item-action><a (click)="delete(item.proficiencyGuid)">
              <button nzDanger nz-button nzType="default" nzShape="circle">
                <span nz-icon nzDanger nzType="delete"></span></button></a></nz-list-item-action>
        </ul>
      </ng-container>
    </nz-list-item>
  </div>
  <ng-template #noContent><nz-empty></nz-empty> </ng-template>
</nz-list>

<nz-modal [(nzVisible)]="isEditModalVisible" [nzTitle]="editModalTitle" [nzContent]="editModalContent" [nzFooter]="null"
  (nzOnCancel)="handleCancel()">
  <ng-template #editModalTitle>Edit Proficiency</ng-template>

  <ng-template #editModalContent>
    <form nz-form [nzAutoTips]="autoTips" [formGroup]="service.editProficiencyModel" nzLayout="vertical"
      (ngSubmit)="updateProficiencyType()">
      <nz-form-item>
        <nz-form-label nzRequired nzFor="proficiencyTitle">Proficiency</nz-form-label>
        <nz-form-control nzErrorTip="This field is required!">
          <input nz-input formControlName="proficiencyTitle" placeholder="e.g, expert" />
        </nz-form-control>
      </nz-form-item>

      <nz-form-item>
        <nz-form-label nzFor="proficiencyDescription">Description</nz-form-label>
        <nz-form-control>
          <textarea nz-input formControlName="proficiencyDescription" placeholder="Description" [nzAutosize]="{ minRows: 1, maxRows: 6 }"></textarea>
        </nz-form-control>
      </nz-form-item>

      <nz-form-item>
        <div style="width: 100%; gap: 0.3em" nz-flex [nzJustify]="'flex-end'" [nzAlign]="'center'">
          <button nz-button nzType="default" (click)="handleCancel()" nzShape="round" type="button">
            Cancel
          </button>
          <button nz-button [nzType]="'primary'" nzShape="round" [nzLoading]="service.editProficiencyModel.pending"
            type="submit">
            Save
          </button>
        </div>
      </nz-form-item>
    </form>
  </ng-template>
</nz-modal>
