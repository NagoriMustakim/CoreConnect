<div nz-flex [nzJustify]="'space-between'" [nzAlign]="'center'">
  <h3>Business Units</h3>

  <button nz-button nzType="primary" nzShape="round" (click)="showModal()">
    <span nz-icon nzType="plus"></span>Add
  </button>
</div>

<nz-list class="demo-loadmore-list" [nzLoading]="initLoading">
  <nz-list-item *ngFor="let item of list">
    <ng-container *ngIf="!item.loading">
      <nz-list-item-meta nzAvatar="{{imageUrl}}/{{ item.businessUnitLogoName }}">
        <nz-list-item-meta-title>
          {{ item.businessUnitName }}
        </nz-list-item-meta-title>
        <nz-list-item-meta-description>
          <!-- <p>{{ item.businessUnitDescription }}</p> -->
          <span *ngIf="item.businessUnitDescription != null && item.businessUnitDescription != ''">
            <p nz-typography nzEllipsis nzExpandable [nzEllipsisRows]="2" class="text-secondary">
              {{item.businessUnitDescription}}</p>
          </span>
        </nz-list-item-meta-description>
      </nz-list-item-meta>
      <ul nz-list-item-actions>
        <nz-list-item-action><a (click)="edit(item)">
            <button nz-button nzType="default" nzShape="circle">
              <span nz-icon nzType="edit" nzTheme="outline"></span>
            </button>
          </a></nz-list-item-action>
        <nz-list-item-action><a (click)="delete(item.businessUnitGuid)">
            <button nzDanger nz-button nzType="default" nzShape="circle">
              <span nz-icon nzDanger nzType="delete"></span></button>
          </a></nz-list-item-action>
      </ul>
    </ng-container>
    <nz-skeleton *ngIf="item.loading" [nzAvatar]="true" [nzActive]="true" [nzTitle]="false"
      [nzLoading]="true"></nz-skeleton>
  </nz-list-item>
</nz-list>

<nz-modal [(nzVisible)]="isModelVisible" [nzTitle]="modalTitle" [nzContent]="modalContent" [nzFooter]="null"
  (nzOnCancel)="handleCancel()">
  <ng-template #modalTitle>Create Business Unit</ng-template>
  <ng-template #modalContent>
    <form nz-form [formGroup]="service.createBusinessUnitForm" nzLayout="vertical">
      <nz-form-item>
        <nz-form-label nzRequired nzFor="businessUnitName">Name</nz-form-label>
        <nz-form-control nzErrorTip="This field is required!">
          <input nz-input formControlName="businessUnitName" placeholder="Name" />
        </nz-form-control>
      </nz-form-item>
      <nz-form-item>
        <nz-form-label nzFor="businessUnitDescription">Description</nz-form-label>
        <nz-form-control>
          <textarea nz-input formControlName="businessUnitDescription" placeholder="Description"
            [nzAutosize]="{ minRows: 1, maxRows: 6 }"></textarea>
        </nz-form-control>
      </nz-form-item>
      <nz-form-item nz-flex nzJustify="end">
        <nz-form-label nzFor="businessUnitLogoName" nzRequired>Logo</nz-form-label>
        <nz-form-control nzErrorTip="Please select image!">
          <nz-upload [nzFileList]="fileList" [nzBeforeUpload]="beforeUpload" nzAccept="image/png, image/jpeg">
            <button nz-button>
              <span nz-icon nzType="upload"></span>
              Select logo
            </button>
          </nz-upload>
          <input type="hidden" name="businessUnitLogoName" formControlName="businessUnitLogoName" />
        </nz-form-control>
      </nz-form-item>

      <nz-form-item>
        <div style="width: 100%; gap: 0.3em" nz-flex [nzJustify]="'flex-end'" [nzAlign]="'center'">
          <button nz-button nzType="default" (click)="handleCancel()" type="button">
            Cancel
          </button>
          <button nz-button [nzType]="'primary'" [nzLoading]="service.createBusinessUnitForm.pending"
            (click)="onSubmit()" type="submit">
            Create Business Unit
          </button>
        </div>
      </nz-form-item>
    </form>
  </ng-template>
</nz-modal>

<nz-modal [(nzVisible)]="isVisible" [nzTitle]="editModalTitle" [nzContent]="editModalContent" [nzFooter]="null"
  (nzOnCancel)="handleCancel()">
  <ng-template #editModalTitle>Edit Business Unit</ng-template>
  <ng-template #editModalContent>
    <form nz-form [formGroup]="service.editBusinessUnitForm" nzLayout="vertical">
      <nz-form-item>
        <nz-form-label nzRequired nzFor="businessUnitName">Name</nz-form-label>
        <nz-form-control nzErrorTip="This field is required!">
          <input nz-input formControlName="businessUnitName" placeholder="Name" />
        </nz-form-control>
      </nz-form-item>
      <nz-form-item>
        <nz-form-label nzFor="businessUnitDescription">Description</nz-form-label>
        <nz-form-control>
          <textarea nz-input formControlName="businessUnitDescription" placeholder="Description"
            [nzAutosize]="{ minRows: 1, maxRows: 6 }"></textarea>
        </nz-form-control>
      </nz-form-item>
      <nz-form-item nz-flex nzJustify="end">
        <nz-form-label>Logo</nz-form-label>
        <nz-form-control nzErrorTip="Please select image!">
          <nz-upload [(nzFileList)]="fileList" [nzBeforeUpload]="beforeUpload" nzAccept="image/png, image/jpeg">
            <button nz-button>
              <span nz-icon nzType="upload"></span>
              Select logo
            </button>
          </nz-upload>
        </nz-form-control>
      </nz-form-item>
      <nz-form-item>
        <div style="width: 100%; gap: 0.3em" nz-flex [nzJustify]="'flex-end'" [nzAlign]="'center'">
          <button nz-button nzType="default" (click)="handleCancel()" type="button">
            Cancel
          </button>
          <button nz-button [nzType]="'primary'" [nzLoading]="service.editBusinessUnitForm.pending" type="submit"
            (click)="handelUpdate()">
            Edit Business Unit
          </button>
        </div>
      </nz-form-item>
    </form>
  </ng-template>
</nz-modal>
